name: Build TvPower APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write # 创建 Release 与上传 APK 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Package APK
        run: |
          set -euo pipefail
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/TvPower-v${VERSION_NAME}.apk"
          done
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvPower-v${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: TvPower v${{ env.VERSION_NAME }}
          body: |
            自动构建的 release 包，版本号取自构建序号。
            提交：${{ github.sha }}
          files: dist/*.apk
