name: Build TvPower APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write # 创建 Release 与上传 APK 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整提交历史与 tag 才能生成更新日志

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Package APK
        run: |
          set -euo pipefail
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/TvPower-v${VERSION_NAME}.apk"
          done
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Generate changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..HEAD"; else RANGE="HEAD"; fi
          {
            echo "### 本次更新"
            echo
            git log $RANGE --no-merges --pretty=format:'- %s（%h）'
            echo
            echo
            echo "### 安装包"
            echo
            echo "- 版本：v${VERSION_NAME}，release 变体，可直接安装"
            echo "- 提交：${GITHUB_SHA}"
          } > CHANGELOG.md
          {
            echo 'CHANGELOG<<__CHANGELOG_EOF__'
            cat CHANGELOG.md
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_ENV"
          cat CHANGELOG.md

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvPower-v${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: TvPower v${{ env.VERSION_NAME }}
          body: ${{ env.CHANGELOG }}
          files: dist/*.apk
